{% load biblio_extras %}<a class="book" href="{% url 'livre_detail' l.pk %}"><div class="cover-image-wrap"><img class="cover cover-img" src="{{ l|couverture }}" alt="Couverture illustrée de {{ l.titre }}" loading="lazy"></div>
<div class="book-meta"><div class="fw-bold book-title">{{ l.titre }}</div><div class="muted small">{{ l.auteur }}</div><div class="avail {% if l.dispo %}ok{% endif %} mt-2">{% if l.dispo %}Disponible à l’emprunt{% else %}Aucun exemplaire disponible{% endif %}</div>{% if l.stock_vente %}<div class="price">En vente : {{ l.prix|floatformat:0 }} FCFA</div>{% endif %}</div></a>
